name: Benchmark

# One repetition of every scenario: install without a cache, then a miss and a hit with each
# caching action. Every run uses its own cache keys and deletes its caches at the end, so
# repetitions never reuse each other's caches. Run it several times and aggregate the results
# with scripts/report.py.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run, as a JSON list (empty runs all of them)
        type: string
        default: ''
  push:
    branches-ignore: [main]
    # Changes to the scripts that dispatch runs and aggregate them do not change the runs.
    paths-ignore: ['**.md', 'scripts/round.sh', 'scripts/report.py']

# Runs never overlap, so they don't compete for the repository's cache storage while they are
# measured. They wait in order instead of being cancelled.
concurrency:
  group: benchmark
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  first:
    name: ${{ matrix.scenario }} · ${{ matrix.variant }} · ${{ matrix.variant == 'baseline' && 'install' || 'miss' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios || '["small", "cpp-boost", "latex", "python-gdal", "rust-sys", "cuda", "debian-cpp"]') }}
        variant: [baseline, can, apt, apt-scripts]
        exclude:
          # cache-apt-pkgs-action only caches apt packages and needs sudo.
          - { scenario: cuda, variant: apt }
          - { scenario: cuda, variant: apt-scripts }
          - { scenario: debian-cpp, variant: apt }
          - { scenario: debian-cpp, variant: apt-scripts }
    uses: ./.github/workflows/_measure.yml
    with:
      scenario: ${{ matrix.scenario }}
      variant: ${{ matrix.variant }}
      phase: ${{ matrix.variant == 'baseline' && 'install' || 'miss' }}
      key: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}

  second:
    name: ${{ matrix.scenario }} · ${{ matrix.variant }} · hit
    needs: first
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios || '["small", "cpp-boost", "latex", "python-gdal", "rust-sys", "cuda", "debian-cpp"]') }}
        variant: [can, apt, apt-scripts]
        exclude:
          - { scenario: cuda, variant: apt }
          - { scenario: cuda, variant: apt-scripts }
          - { scenario: debian-cpp, variant: apt }
          - { scenario: debian-cpp, variant: apt-scripts }
    uses: ./.github/workflows/_measure.yml
    with:
      scenario: ${{ matrix.scenario }}
      variant: ${{ matrix.variant }}
      phase: hit
      key: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}

  cleanup:
    name: Delete this run's caches
    needs: second
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json id,key,sizeInBytes \
            --jq '.[] | "\(.id) \(.sizeInBytes) \(.key)"'
          gh cache delete --all --repo "${GITHUB_REPOSITORY}" || true
